<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container auth">
    <h2>Register</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="post">
        <input name="username" placeholder="Username" required minlength="3">
        <input type="password" name="password" placeholder="Password (min 6 characters)" required minlength="6">
        <button type="submit">Create Account</button>
    </form>

    <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>

</body>
</html>
